<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/auth.css">
    <title>Connexion - IF-EDUprime</title>
</head>
<body>
    <div class="container">
        <div class="left-section"></div>
        <div class="right-section">
            <div class="header-text">Démarrons ici</div>
            <form action="" class="login-section">
                <div class="form-input">
                    <input type="email" name="email" id="email" placeholder="Email" required>
                </div>
                <div class="form-input">
                    <input type="password" name="password" id="password" placeholder="Mot de passe" required>
                </div>
                <div class="term-condition">
                    En vous connectant, vous acceptez nos
                    <a href="#">Conditions</a> et <a href="#">Politique de confidentialité</a>
                </div>
                <button type="submit" class="btn-sign-in">Se connecter</button>
            </form>
            <div class="forget-password">
                <a href="#" style="text-decoration:none; color:inherit;">Mot de passe oublié ?</a>
            </div>
            <div class="seperator-text">
                ou <strong>Continuer</strong> avec
            </div>
            <div class="social-login">
                <button type="button"><img src="assets/google-logo.png" alt="Google"></button>
                <button type="button"><img src="assets/facebook-logo.png" alt="Facebook"></button>
                <button type="button"><img src="assets/apple-logo.png" alt="Apple"></button>
            </div>
            <div class="sign-up-redirect">
                <p>Vous n'avez pas de compte ?
                    <a href="register.html"><strong>S'inscrire</strong></a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
