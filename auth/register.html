<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/auth.css">
    <title>Inscription - IF-EDUprime</title>
</head>
<body>
    <div class="container">
        <div class="left-section"></div>
        <div class="right-section">
            <div class="header-text">Créer un compte</div>
            <form action="" class="login-section">
                <div class="form-input">
                    <input type="text" name="name" id="name" placeholder="Nom et prénom" required>
                </div>
                <div class="form-input">
                    <input type="tel" name="phone" id="phone" placeholder="Téléphone">
                </div>
                <div class="form-input">
                    <input type="email" name="email" id="email" placeholder="Email" required>
                </div>
                <div class="form-input">
                    <input type="password" name="password" id="password" placeholder="Mot de passe" required>
                </div>
                <div class="term-condition">
                    En cliquant sur le bouton ci-dessous, vous acceptez nos
                    <a href="#">Conditions</a> et <a href="#">Politique de confidentialité</a>
                </div>
                <button type="submit" class="btn-sign-in">S'inscrire</button>
            </form>
            <div class="seperator-text">
                ou <strong>Continuer</strong> avec
            </div>
            <div class="social-login">
                <button type="button"><img src="assets/google-logo.png" alt="Google"></button>
                <button type="button"><img src="assets/facebook-logo.png" alt="Facebook"></button>
                <button type="button"><img src="assets/apple-logo.png" alt="Apple"></button>
            </div>
            <div class="sign-up-redirect">
                <p>Vous avez déjà un compte ?
                    <a href="login.html"><strong>Se connecter</strong></a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
